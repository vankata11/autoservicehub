<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AutoServiceHub</title>
  </head>
  <body>
    <main class="py-5">
      <div class="container container-narrow">

        <div class="mb-3">
          <h1 class="h4 mb-1">Админ панел</h1>
          <div class="text-secondary small">
            Управление на всички сервизни заявки.
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-secondary small">Общо заявки</div>
                <div id="statTotal" class="fs-3 fw-bold">0</div>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-secondary small">Нови</div>
                <div id="statNew" class="fs-3 fw-bold">0</div>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-secondary small">В процес</div>
                <div id="statInProgress" class="fs-3 fw-bold">0</div>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-secondary small">Завършени</div>
                <div id="statDone" class="fs-3 fw-bold">0</div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Търси по заглавие, клиент или автомобил..."
            >
          </div>

          <div class="col-md-4">
            <select id="statusFilter" class="form-select">
              <option value="all">Всички статуси</option>
              <option value="new">Нови</option>
              <option value="in_progress">В процес</option>
              <option value="done">Завършени</option>
            </select>
          </div>
        </div>

        <div class="card p-3 p-lg-4">

          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-dark" role="status"></div>
            <div class="mt-2 small text-secondary">
              Зареждане...
            </div>
          </div>

          <div id="errorState" class="alert alert-danger d-none text-center">
            Възникна грешка при зареждане на заявките.
            <br>
            <button class="btn btn-outline-dark btn-sm mt-2" onclick="location.reload()">
              Презареди
            </button>
          </div>

          <div id="emptyState" class="text-center py-5 text-secondary d-none">
            Няма заявки по зададените критерии.
          </div>

          <div class="table-responsive">
            <table id="tbl" class="table align-middle mb-0">
              <thead>
                <tr>
                  <th class="text-secondary small">Създадена</th>
                  <th>Заглавие</th>
                  <th class="text-secondary small">Потребител</th>
                  <th>Статус</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/pages/admin.js"></script>
  </body>
</html>
