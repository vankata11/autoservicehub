<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AutoServiceHub</title>
  </head>
  <body>
    <main class="py-5">
      <div class="container container-narrow">
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div class="card p-4 p-lg-5">
              <h1 class="h4 mb-3">Нова сервизна заявка</h1>

              <form id="formCreate" class="vstack gap-3">
                <div>
                  <label class="form-label">Заглавие</label>
                  <input id="title" class="form-control" placeholder="Напр. шум при завиване" required>
                </div>

                <div>
                  <label class="form-label">Автомобил</label>
                  <input id="car" class="form-control" placeholder="Напр. VW Golf 6 1.6 BiFuel 2009" required>
                </div>

                <div>
                  <label class="form-label">Описание</label>
                  <textarea id="description" class="form-control" rows="5" placeholder="Опиши симптомите, кога се появява, какво вече е правено..." required></textarea>
                </div>

                <section class="border rounded-3 p-3 bg-light">
                  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                    <div>
                      <h2 class="h5 mb-1">AI сервизна препоръка</h2>
                      <p class="text-secondary mb-0">
                        Опиши проблема с естествен текст и получи интелигентна препоръка.
                      </p>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="aiIssueInput" class="form-label">Опиши проблема</label>
                    <textarea
                      id="aiIssueInput"
                      class="form-control"
                      rows="4"
                      placeholder="Пример: Колата тресе на празен ход, свети check engine и гори повече от обикновено."
                    ></textarea>
                  </div>

                  <div class="d-flex gap-2 flex-wrap">
                    <button type="button" id="aiSuggestBtn" class="btn btn-outline-primary">
                      Генерирай AI препоръка
                    </button>
                    <button type="button" id="aiUseSuggestionBtn" class="btn btn-outline-success d-none">
                      Използвай в заявката
                    </button>
                  </div>

                  <div id="aiSuggestionBox" class="alert alert-white border mt-3 d-none mb-0">
                    <h3 class="h6 mb-3">Резултат</h3>
                    <p class="mb-2"><strong>Възможен проблем:</strong> <span id="aiPossibleIssue">—</span></p>
                    <p class="mb-2"><strong>Препоръчана услуга:</strong> <span id="aiRecommendedService">—</span></p>
                    <p class="mb-2"><strong>Спешност:</strong> <span id="aiUrgency">—</span></p>
                    <p class="mb-0"><strong>Съвет:</strong> <span id="aiAdvice">—</span></p>
                  </div>
                </section>

                <div>
                  <label class="form-label">Файлове (до 5)</label>
                  <input id="files" type="file" class="form-control" multiple accept="image/*,application/pdf">
                  <div class="form-text text-secondary">Пример: снимки, фактури, диагностични скрийншоти.</div>
                </div>

                <button class="btn btn-dark" type="submit">Създай</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/pages/create-request.js"></script>
  </body>
</html>
