<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AutoServiceHub</title>
  </head>
  <body>
    <main class="py-5">
      <div class="container container-narrow">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
          <div>
            <h1 id="title" class="h3 mb-1"></h1>
            <div class="text-secondary small">Създадена: <span id="created"></span></div>
          </div>
          <a class="btn btn-outline-dark" href="/dashboard.html">Назад</a>
        </div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm p-4 mb-4">
              <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                <h2 class="h5 mb-0">Детайли</h2>
                <div id="status"></div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-12">
                  <div class="text-secondary small">Автомобил</div>
                  <div id="car" class="fw-semibold"></div>
                </div>
              </div>

              <hr>

              <div>
                <div class="text-secondary small mb-2">Описание</div>
                <div id="desc" class="bg-light rounded-3 p-3 lh-lg"></div>
              </div>
            </div>

            <div id="aiSummaryCard" class="card border-0 shadow-sm p-4 d-none">
              <h2 class="h5 mb-3">AI обобщение</h2>
              <div id="aiSummaryContent" class="text-secondary"></div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-4">
              <h2 class="h5 mb-3">Файлове</h2>

              <div id="filesEmptyState" class="text-secondary small d-none">
                Няма качени файлове към тази заявка.
              </div>

              <ul id="files" class="list-group list-group-flush"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/pages/request.js"></script>
  </body>
</html>
